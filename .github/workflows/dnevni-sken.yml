# Dnevni sken cena na GitHubu, nezavisno od Markovog računara.
# Repozitorijum je javan (bez ograničenja minuta), pa se ništa osetljivo ne čuva otvoreno:
#  - stanje (baza, keš, kurs, oznake, sličice) je stanje.enc u izdanju "stanje", šifrovano lozinkom
#  - stranica za telefon se šifruje istom lozinkom i objavljuje na grani gh-pages (GitHub Pages)
# Jedina tajna: PAGE_PASSWORD (upisuje je Marko skriptom cloud/postavi-lozinku.ps1).
name: Dnevni sken

on:
  schedule:
    - cron: "0 5 * * *"   # 06:00 zimi i 07:00 leti po beogradskom vremenu; GitHub ume da kasni do pola sata
  workflow_dispatch:
    inputs:
      mode:
        description: "sken = pun sken i objava; proba = samo proveri koje prodavnice odgovaraju sa GitHuba"
        type: choice
        options: [sken, proba]
        default: sken

permissions:
  contents: write   # fajl izdanja "stanje" i grana gh-pages

concurrency:
  group: dnevni-sken
  cancel-in-progress: false

jobs:
  sken:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      TZ: Europe/Belgrade
      GH_TOKEN: ${{ github.token }}
      PAGE_PASSWORD: ${{ secrets.PAGE_PASSWORD }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Zavisnosti
        run: pip install -r requirements.txt

      - name: Preuzmi i dešifruj stanje
        id: stanje
        run: |
          test -n "$PAGE_PASSWORD" || { echo "Nema tajne PAGE_PASSWORD"; exit 1; }
          gh release download stanje --pattern stanje.enc --dir "$RUNNER_TEMP"
          node cloud/crypt.mjs dec "$RUNNER_TEMP/stanje.enc" "$RUNNER_TEMP/stanje.tar.gz"
          python -m cloud.state unpack "$RUNNER_TEMP/stanje.tar.gz"
          rm "$RUNNER_TEMP/stanje.tar.gz"

      - name: Proba prodavnica
        if: inputs.mode == 'proba'
        run: python main.py doctor || true

      - name: Sken, cene u inostranstvu, izveštaj i sličice
        if: inputs.mode != 'proba'
        run: |
          set +e
          python main.py scan --top 20; scan=$?
          python main.py foreign
          python main.py report
          python main.py thumbs
          echo "Sken je završio sa kodom $scan (1 = neka prodavnica nije proverena)."

      - name: Šifruj i sačuvaj stanje
        # samo ako je stanje uspešno preuzeto, da prazna baza nikad ne zameni pravu
        if: always() && inputs.mode != 'proba' && steps.stanje.outcome == 'success'
        run: |
          python -m cloud.state pack "$RUNNER_TEMP/stanje.tar.gz"
          node cloud/crypt.mjs enc "$RUNNER_TEMP/stanje.tar.gz" "$RUNNER_TEMP/stanje.enc"
          rm "$RUNNER_TEMP/stanje.tar.gz"
          gh release upload stanje "$RUNNER_TEMP/stanje.enc" --clobber

      - name: Šifruj stranicu za telefon
        id: stranica
        if: inputs.mode != 'proba' && hashFiles('reports/output/page.html') != ''
        run: |
          mkdir -p site/thumbs
          cp reports/output/thumbs/*.webp site/thumbs/ || true
          node cloud/encrypt_page.mjs reports/output/page.html site/index.html
          touch site/.nojekyll
          printf 'User-agent: *\nDisallow: /\n' > site/robots.txt

      - name: Objavi stranicu
        if: steps.stranica.outcome == 'success'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ github.token }}
          publish_branch: gh-pages
          publish_dir: ./site
          force_orphan: true   # bez istorije, da repozitorijum ne raste svaki dan
          commit_message: "Dashboard"
