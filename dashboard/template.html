<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deal Finder Patike</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Martian+Mono:wght@400;600&display=swap">
<style>
:root {
  /* run.marko: Linija (svetla) i Asfalt (tamna) podloga, Hi-vis narandžasta za akciju, Sat mint za dobru ponudu.
     Archivo za tekst, Martian Mono za cene i brojeve (kao na sportskom satu). */
  color-scheme: light;
  --page:#F4F5F1; --surface:#ffffff; --ink:#15171B; --ink2:#454952; --muted:#6b6f79; --grid:#e3e4de; --axis:#c6c8c0;
  --border:rgba(21,23,27,.13); --accent:#C2410C; --good:#0A7A52; --bad:#C22B2B; --warn:#8a5a00; --wash:rgba(21,23,27,.05);
  --hot:#FF5A1F; --on-hot:#15171B; --mint:#7DEFC0; --on-mint:#0c2b20; --shadow:0 10px 30px rgba(21,23,27,.10);
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#6250d6;--s8:#e34948;
}
@media (prefers-color-scheme: dark) { :root:where(:not([data-theme="light"])) {
  color-scheme: dark;
  --page:#15171B; --surface:#1E2127; --ink:#F4F5F1; --ink2:#C3C6CC; --muted:#8E929B; --grid:#2B2F37; --axis:#3A3F49;
  --border:rgba(244,245,241,.13); --accent:#FF8A5C; --good:#7DEFC0; --bad:#FF7070; --warn:#F0B040; --wash:rgba(244,245,241,.06);
  --hot:#FF5A1F; --on-hot:#15171B; --mint:#7DEFC0; --on-mint:#0c2b20; --shadow:0 14px 36px rgba(0,0,0,.45);
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;
}}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page:#15171B; --surface:#1E2127; --ink:#F4F5F1; --ink2:#C3C6CC; --muted:#8E929B; --grid:#2B2F37; --axis:#3A3F49;
  --border:rgba(244,245,241,.13); --accent:#FF8A5C; --good:#7DEFC0; --bad:#FF7070; --warn:#F0B040; --wash:rgba(244,245,241,.06);
  --hot:#FF5A1F; --on-hot:#15171B; --mint:#7DEFC0; --on-mint:#0c2b20; --shadow:0 14px 36px rgba(0,0,0,.45);
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;
}
* { box-sizing:border-box; }
body { margin:0; background:var(--page); color:var(--ink); font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; }
a { color:var(--accent); }
header { padding:20px 20px 8px; max-width:1240px; margin:auto; }
h1 { font-size:22px; margin:0 0 4px; }
.sub { color:var(--ink2); }
main { max-width:1240px; margin:auto; padding:0 20px 60px; }
.filters { position:sticky; top:0; z-index:5; background:var(--page); padding:10px 0; display:flex; flex-wrap:wrap; gap:8px; align-items:center; border-bottom:1px solid var(--border); }
.filters label { display:flex; flex-direction:column; font-size:11px; color:var(--muted); gap:2px; }
select,input { font:inherit; color:var(--ink); background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:5px 7px; min-width:0; }
input[type=search] { width:170px; } input[type=number] { width:100px; }
button { font:inherit; color:var(--ink); background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:6px 10px; cursor:pointer; }
button:hover { background:var(--wash); }
nav.tabs { display:flex; flex-wrap:wrap; gap:4px; margin:14px 0; }
nav.tabs button[aria-selected=true] { background:var(--ink); color:var(--page); border-color:var(--ink); }
.note { color:var(--ink2); margin:0 0 12px; max-width:90ch; }
.offer { background:var(--surface); border:1px solid var(--border); border-radius:8px; margin-bottom:8px; }
.offer summary, .cols { display:grid; grid-template-columns:minmax(0,2fr) minmax(0,1.1fr) 58px minmax(0,1.2fr) minmax(0,1.1fr) minmax(0,1.2fr) minmax(0,1.1fr) 52px 88px; gap:12px; padding:12px 14px; }
.offer summary { list-style:none; cursor:pointer; align-items:start; }
.cols { padding:4px 14px; margin-bottom:4px; position:sticky; top:var(--filters-h,0); z-index:4; background:var(--page); }
.sort { border:0; background:none; padding:3px 0; font-size:12px; font-weight:600; color:var(--ink2); text-align:left; white-space:nowrap; }
.sort:hover { background:none; color:var(--ink); text-decoration:underline; }
.sort[aria-sort] { color:var(--ink); }
.lbl { display:none; font-size:11px; color:var(--muted); }
.big { font-size:15px; font-weight:600; font-variant-numeric:tabular-nums; }
.picked { font-weight:700; color:var(--ink); }
.field { display:flex; flex-direction:column; font-size:11px; color:var(--muted); gap:2px; }
.multi { position:relative; }
.multi summary { list-style:none; cursor:pointer; font-size:14px; color:var(--ink); background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:5px 7px; min-width:110px; max-width:220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.multi summary::-webkit-details-marker { display:none; }
.multi-panel { position:absolute; top:calc(100% + 4px); left:0; z-index:6; width:290px; max-width:calc(100vw - 32px); background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:10px; box-shadow:0 2px 8px rgba(0,0,0,.15); }
.multi-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:2px 8px; max-height:280px; overflow-y:auto; margin-bottom:8px; }
.filters .multi-grid label { flex-direction:row; align-items:center; gap:5px; font-size:13px; color:var(--ink); padding:3px 0; cursor:pointer; }
.offer summary::-webkit-details-marker { display:none; }
.name { font-weight:600; }
.who { display:flex; gap:10px; align-items:flex-start; min-width:0; }
.who > div:last-child { min-width:0; }
.thumb { flex:none; width:72px; height:72px; object-fit:contain; background:#fff; border:1px solid var(--border); border-radius:6px; }
.thumb.none { display:flex; align-items:center; justify-content:center; background:var(--wash); color:var(--muted); font-size:11px; text-align:center; }
table .thumb { width:44px; height:44px; }
.small { font-size:12px; color:var(--ink2); }
.price { font-size:17px; font-weight:600; font-variant-numeric:tabular-nums; }
.old { text-decoration:line-through; color:var(--muted); font-size:12px; }
.score { font-size:17px; font-weight:600; font-variant-numeric:tabular-nums; }
.cls { font-size:11px; font-weight:600; letter-spacing:.02em; }
.cls.top { color:var(--good); } .cls.over { color:var(--bad); } .cls.none { color:var(--muted); }
.cls.top,.cls.fill { display:inline-block; padding:1px 6px; border-radius:4px; border:1px solid var(--good); }
.cls.fill { background:var(--good); color:var(--surface); }
.only-phone { display:none; }
.more { display:contents; }
.mine[aria-pressed=true] { background:var(--ink); color:var(--page); border-color:var(--ink); }
.stale { margin-top:6px; padding:6px 10px; border:1px solid var(--bad); border-radius:6px; color:var(--bad); font-weight:600; }
.tokenform { margin-top:8px; padding:10px; border:1px solid var(--border); border-radius:6px; max-width:420px; }
.scanbtn:disabled { opacity:.6; }
.running { margin-top:6px; color:var(--good); font-weight:600; }
.scanbtn { cursor:pointer; font:inherit; display:inline-block; margin-top:8px; padding:6px 10px; border:1px solid var(--border); border-radius:6px; background:var(--surface); color:var(--ink); text-decoration:none; font-weight:600; }
.flag { color:var(--warn); }
.change { margin-top:3px; font-size:12px; font-weight:600; }
.change.new_low,.change.down { color:var(--good); } .change.up { color:var(--bad); }
.change .small { display:block; font-weight:400; }
.detail { padding:4px 14px 14px; display:grid; grid-template-columns:1fr 1fr; gap:18px; border-top:1px solid var(--border); }
.detail h4 { margin:10px 0 4px; font-size:13px; }
.detail ul { margin:0; padding-left:18px; }
.sizes { display:flex; flex-wrap:wrap; gap:4px; }
.size { padding:1px 6px; border:1px solid var(--border); border-radius:4px; font-size:12px; font-variant-numeric:tabular-nums; }
.size.no { color:var(--muted); text-decoration:line-through; }
.size.want { border-color:var(--ink); font-weight:600; }
.buy { display:inline-block; margin-top:8px; font-weight:600; }
.stores { display:flex; flex-wrap:wrap; gap:4px; align-items:center; }
.offer summary > .stores { grid-column:1 / -1; }
.store { padding:2px 7px; border:1px solid var(--border); border-radius:4px; font-size:12px; font-variant-numeric:tabular-nums; text-decoration:none; }
.store:hover { background:var(--wash); }
.store.hand { border-style:dashed; color:var(--ink2); }
.store.usedbtn { margin-left:auto; } .store.mark { color:var(--ink2); }
.notice { max-width:none; padding:8px 10px; background:var(--surface); border:1px solid var(--border); border-radius:6px; color:var(--ink); }
.store span { color:var(--ink2); }
table { border-collapse:collapse; width:100%; background:var(--surface); }
th,td { text-align:left; padding:6px 9px; border-bottom:1px solid var(--grid); vertical-align:top; }
th { font-size:12px; color:var(--ink2); font-weight:600; }
td.num { font-variant-numeric:tabular-nums; text-align:right; }
.tablewrap { overflow-x:auto; border:1px solid var(--border); border-radius:8px; margin-bottom:14px; }
.group { margin-bottom:22px; }
.group h3 { margin:0 0 3px; font-size:15px; }
.chart { position:relative; }
.legend { display:flex; flex-wrap:wrap; gap:10px; font-size:12px; color:var(--ink2); margin-bottom:4px; }
.key { display:inline-block; width:14px; height:2px; vertical-align:middle; margin-right:4px; }
.tip { position:absolute; pointer-events:none; background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:6px 8px; font-size:12px; box-shadow:0 2px 8px rgba(0,0,0,.15); display:none; z-index:3; white-space:nowrap; }
.tip b { font-variant-numeric:tabular-nums; }
.empty { padding:24px; color:var(--ink2); background:var(--surface); border:1px dashed var(--border); border-radius:8px; }
@media (max-width:760px) {
  header { padding:16px 16px 8px; } main { padding:0 16px 40px; }
  .filters { position:static; align-items:flex-end; }
  .only-phone { display:inline-block; }
  .filters:not(.open) .more { display:none; }
  .filters.open .more { display:flex; flex-wrap:wrap; gap:8px; width:100%; align-items:flex-end; }
  .filters > label:first-child { flex:1 1 100%; }
  nav.tabs { flex-wrap:nowrap; overflow-x:auto; margin:10px -16px; padding:0 16px 4px; scrollbar-width:none; }
  nav.tabs button { flex:none; white-space:nowrap; }
  .note:not(.notice), .xmeta, .cols { display:none !important; }
  /* Zatvorena kartica je kratka: slika, ime, cena, popust, skor i brojevi. Ostalo se vidi kad se otvori. */
  .offer summary { grid-template-columns:1.3fr .7fr 1fr; gap:6px 10px; padding:10px 12px; }
  .offer summary > :first-child, .offer summary > .sz, .offer summary > .stores { grid-column:1 / -1; }
  .offer summary > .sz { order:2; } .offer summary > .stores { order:3; }
  .offer:not([open]) .xtra { display:none; }
  .thumb { width:60px; height:60px; }
  .lbl { display:block; }
  .detail { grid-template-columns:minmax(0,1fr); } .detail > div { min-width:0; overflow-wrap:anywhere; }
  input[type=search] { width:100%; }
}

/* ===== izgled run.marko ===== */
body { font:14px/1.45 "Archivo",system-ui,-apple-system,"Segoe UI",sans-serif; }
.mono, .price, .old, .big, .score, .size, .store, td.num, .sub, .cols .sort, .rank { font-family:"Martian Mono",ui-monospace,Consolas,monospace; font-variant-numeric:tabular-nums; }
header { padding:26px 20px 10px; display:grid; grid-template-columns:1fr auto; gap:6px 16px; align-items:end; }
h1 { font:900 34px/0.95 "Archivo",sans-serif; font-stretch:125%; text-transform:uppercase; letter-spacing:-.02em; margin:0; text-wrap:balance; }
h1 em { font-style:normal; color:var(--hot); }
.lane { grid-column:1 / -1; height:5px; border-radius:3px; background:repeating-linear-gradient(90deg,var(--hot) 0 34px,transparent 34px 52px); opacity:.9; }
.sub { grid-column:1 / -1; font-size:11px; color:var(--muted); line-height:1.6; }
.sub a { color:inherit; }
.theme { border-radius:999px; width:38px; height:38px; padding:0; font-size:17px; line-height:1; }
.scanbtn { grid-column:1 / -1; justify-self:start; margin-top:4px; border-radius:999px; padding:7px 14px; background:var(--ink); color:var(--page); border-color:var(--ink); }
.stale, .running, .tokenform { grid-column:1 / -1; }
.tokenform { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:12px 14px; max-width:520px; }
button, select, input { border-radius:10px; }
button:focus-visible, a:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible { outline:2px solid var(--hot); outline-offset:2px; }
.filters { margin-top:8px; padding:12px 14px; background:var(--surface); border:1px solid var(--border); border-radius:16px; box-shadow:var(--shadow); align-items:flex-end; gap:10px; top:8px; }
.filters label, .field { font-family:"Martian Mono",monospace; font-size:9.5px; letter-spacing:.09em; text-transform:uppercase; gap:4px; }
.filters select, .filters input, .multi summary { background:var(--page); padding:7px 9px; font-family:"Archivo",sans-serif; font-size:14px; letter-spacing:0; text-transform:none; border-radius:10px; }
.filters .multi-grid label { font-family:"Archivo",sans-serif; letter-spacing:0; text-transform:none; }
.chip { border-radius:999px; padding:7px 13px; font-weight:600; white-space:nowrap; background:var(--page); }
.chip[aria-pressed=true], .mine[aria-pressed=true] { background:var(--ink); color:var(--page); border-color:var(--ink); }
nav.tabs { gap:6px; margin:16px 0 14px; }
nav.tabs button { border-radius:999px; padding:7px 14px; font-weight:600; background:transparent; }
nav.tabs button:hover { background:var(--wash); }
nav.tabs button[aria-selected=true] { background:var(--hot); color:var(--on-hot); border-color:var(--hot); }
.note { font-size:13px; }
.cols { background:var(--page); }
.cols .sort { font-size:10px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); }
.offer { position:relative; border-radius:16px; margin-bottom:10px; transition:border-color .15s, box-shadow .15s, transform .15s; }
.offer:hover, .offer[open] { border-color:color-mix(in srgb,var(--hot) 55%,var(--border)); box-shadow:var(--shadow); }
.offer summary { padding:16px 18px; gap:14px; }
.who { gap:12px; }
.rank { flex:none; width:26px; padding-top:4px; font-size:12px; font-weight:600; color:var(--muted); }
.thumb { width:88px; height:88px; border-radius:14px; }
table .thumb { width:48px; height:48px; border-radius:10px; }
.name { font:700 16px/1.2 "Archivo",sans-serif; font-stretch:112%; letter-spacing:-.01em; margin-bottom:2px; }
.price { font-size:18px; letter-spacing:-.05em; white-space:nowrap; }
.big, .score { letter-spacing:-.03em; }
.disc { display:inline-block; background:var(--hot); color:var(--on-hot); font-size:13px; font-weight:600; padding:2px 8px; border-radius:7px; }
.cls { font-family:"Martian Mono",monospace; font-size:10px; letter-spacing:.04em; }
.cls.top, .cls.fill { padding:2px 7px; border-radius:6px; border:1px solid var(--good); }
.cls.fill { background:var(--mint); color:var(--on-mint); border-color:var(--mint); }
.change { font-family:"Martian Mono",monospace; font-size:11px; }
.stores { gap:6px; }
.store { border-radius:999px; padding:4px 11px; font-size:11.5px; color:var(--ink); background:var(--page); }
.stores > a.store:first-of-type { border-color:var(--hot); }
.store.mark, .store.usedbtn { font-family:"Archivo",sans-serif; font-weight:600; }
.store.usedbtn[aria-pressed=true] { background:var(--hot); color:var(--on-hot); border-color:var(--hot); }
.size { border-radius:6px; font-size:11px; }
.offer.used summary > :not(.stores) { opacity:.45; }
.offer.used::after { content:"ISKORIŠĆENO"; position:absolute; top:12px; right:14px; font:600 10px "Martian Mono",monospace; letter-spacing:.14em; color:var(--hot); border:1.5px solid var(--hot); border-radius:5px; padding:2px 7px; transform:rotate(3deg); background:var(--surface); }
.tablewrap { border-radius:14px; }
th { font-family:"Martian Mono",monospace; font-size:10px; letter-spacing:.07em; text-transform:uppercase; }
.empty { border-radius:16px; }
@media (min-width:761px) { .offer summary, .cols { grid-template-columns:minmax(0,2fr) minmax(116px,1.1fr) 64px minmax(0,1.2fr) minmax(0,1.1fr) minmax(0,1.2fr) minmax(0,1.1fr) 52px 88px; } }
/* slika: uvećanje, pa okret za 180 stepeni i nazad dok je kursor na njoj. Jedna fotografija po patici,
   pa je "druga strana" ista slika u ogledalu (natpisi su obrnuti); prava druga strana traži drugu fotografiju. */
.who { perspective:900px; }
.thumb { position:relative; transform-origin:left center; transition:scale .3s ease, box-shadow .3s ease; }
.thumb:not(.none) { cursor:zoom-in; }
@keyframes turn180 { 0%,12% { rotate:y 0deg; } 50%,62% { rotate:y 180deg; } 100% { rotate:y 360deg; } }
@media (hover:hover) { .thumb:not(.none):hover { scale:2.7; z-index:30; box-shadow:0 20px 44px rgba(0,0,0,.4); animation:turn180 5s .35s ease-in-out infinite; } }
.thumb.zoom { scale:2.7; z-index:30; box-shadow:0 20px 44px rgba(0,0,0,.4); animation:turn180 5s .35s ease-in-out infinite; cursor:zoom-out; }
@media (prefers-reduced-motion:reduce) { .thumb:not(.none):hover, .thumb.zoom { animation:none; } .offer, .thumb { transition:none; } }
@media (max-width:760px) {
  header { padding:18px 16px 8px; } h1 { font-size:26px; }
  .filters { top:0; padding:10px 12px; border-radius:14px; }
  .thumb { width:72px; height:72px; }
  .rank { width:22px; }
  .offer summary { padding:12px 14px; }
  .offer.used::after { top:auto; bottom:10px; right:10px; }
}
</style>

<body>
<header>
  <h1>Patike <em>na popustu</em></h1>
  <button class="theme" id="theme" type="button" aria-label="Promeni svetlu i tamnu temu" title="Svetla / tamna tema">◐</button>
  <div class="lane" aria-hidden="true"></div>
  <div class="sub" id="meta"></div>
</header>
<main>
  <div class="filters" id="filters"></div>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <div id="content"></div>
</main>
<script>
const DATA = /*__DATA__*/null;
const CATS = {daily_trainer:"Svakodnevne",long_run:"Duge staze",tempo:"Tempo",interval:"Intervali",racing:"Trka",recovery:"Oporavak",stability:"Stabilnost"};
const STAT = {VERIFIED:"Provereno",PARTIAL:"Delimično",NOT_VERIFIED:"NOT VERIFIED",NOT_CHECKED:"Nije skenirano"};
const AVAIL = {AVAILABLE:"Dostupno",OUT_OF_STOCK:"Nema na stanju",UNKNOWN:"Nepoznato"};
const CLAIM = {NONE:"bez popusta",CLAIMED:"tvrdnja prodavca, nije potvrđena",CONTRADICTED:"tvrdnja je osporena podacima",SUPPORTED:"potkrepljeno našom istorijom"};
const RETAILER_ORDER = DATA.retailers.map(r=>r.retailer).sort();

function el(tag, attrs, ...kids) {
  const node = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs||{})) {
    if (v===null||v===undefined||v===false) continue;
    if (k==="class") node.className=v; else if (k==="text") node.textContent=v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2),v); else node.setAttribute(k,v);
  }
  for (const kid of kids.flat()) if (kid!==null&&kid!==undefined) node.append(kid);
  return node;
}
const rsd = v => v===null||v===undefined ? "n/a" : Math.round(v).toLocaleString("sr-RS")+" RSD";
const pct = v => v===null||v===undefined ? "n/a" : (v>0?"+":"")+(v*100).toFixed(1)+"%";
const when = s => s ? new Date(s+"Z").toLocaleString("sr-RS",{dateStyle:"short",timeStyle:"short"}) : "nije provereno";
// Muški i unisex oglas istog modela su posebni redovi, pa naziv mora da ih razlikuje.
const fullName = o => { const tags=[...o.qualifiers,...(o.gender==="unisex"?["unisex"]:[])]; return `${o.brand} ${o.model}${tags.length?" ("+tags.join(", ")+")":""}`; };
const safeUrl = u => /^https?:\/\//.test(u||"") ? u : null;

const state = {tab:"top", q:"", gender:DATA.profile.gender, brand:"", sizes:new Set(), retailer:"", category:"", maxPrice:"", minPrice:"", min4:false, hideUsed:false, confidence:DATA.profile.minimum_deal_confidence, sort:"", dir:1, minDiscount:""};
// Izbor (kartica, pol, brojevi) se pamti u ovom pregledaču, da stranica sledeći put ne kreće od nule.
const PREFS="patike-izbor";
try{
  const saved=JSON.parse(localStorage.getItem(PREFS)||"null");
  if(saved){
    if(["men","women"].includes(saved.gender)) state.gender=saved.gender;
    if(typeof saved.tab==="string") state.tab=saved.tab;
    if(Array.isArray(saved.sizes)) state.sizes=new Set(saved.sizes.map(String));
    state.min4=saved.min4===true; state.hideUsed=saved.hideUsed===true;

function sizeValue(label){
  const m=String(label).trim().match(/^(\d+(?:[.,]\d+)?)(?:\s+(\d+)\/(\d+))?$/);
  return m?parseFloat(m[1].replace(",","."))+(m[2]?Number(m[2])/Number(m[3]):0):null;

function priceOf(o){
  if(!state.sizes.size) return o.price;
  const prices=(o.sizes||[]).filter(s=>s.available===true&&state.sizes.has(s.norm)).map(s=>s.price||o.price);
  return prices.length?Math.min(...prices):o.price;

function filtered(pool, anyConfidence) {
  const q = state.q.trim().toLowerCase();
  return pool.filter(o=>{
    if (notRunning.has(o.model_id)) return false;
    if (q && !fullName(o).toLowerCase().includes(q)) return false;
    if (state.brand && o.brand!==state.brand) return false;
    if (state.retailer && o.retailer!==state.retailer) return false;
    if (state.category && !o.categories.includes(state.category)) return false;
    if (!hasPicked(o)) return false;
    if (state.maxPrice && priceOf(o)>Number(state.maxPrice)) return false;
    if (state.minPrice && priceOf(o)<Number(state.minPrice)) return false;
    if (state.min4 && liveLabels(o).length<TOP_MIN_SIZES) return false;
    if (state.hideUsed && state.tab!=="used" && used.has(o.group)) return false;
    if (state.minDiscount && (o.claimed_discount||0)*100<Number(state.minDiscount)) return false;
    if (!anyConfidence && state.confidence && CONF[o.confidence]<CONF[state.confidence]) return false;
    return true;
  });
}

function compareBy(key,dir,value=COLUMNS[key].value){
  return (a,b)=>{
    const x=value(a), y=value(b);
    if(x===null||x===undefined) return y===null||y===undefined?0:1;
    if(y===null||y===undefined) return -1;
    return dir*(typeof x==="string"?x.localeCompare(y,"sr",{numeric:true}):x-y);

// Sa izabranom veličinom red je najjeftinija ponuda sa tom veličinom, i kada ona sama ne bi prošla u rang.
function oneRowPerModel(list,fallback,keep=()=>true){
  const picked=state.sizes.size>0;
  // Pri istoj ceni ostaje boja koja se vidi bez izabranog broja (najjeftinija dostupna boja modela), da red ne promeni patiku.
  const shownSku=new Map();
  if(picked) for(const o of DATA.offers.filter(o=>o.availability==="AVAILABLE").sort((a,b)=>a.price-b.price)) if(!shownSku.has(o.group)) shownSku.set(o.group,o.sku);
  const sameColor=o=>o.sku&&shownSku.get(o.group)===o.sku?0:1;
  const best=picked?(a,b)=>Number(a.stale)-Number(b.stale)||priceOf(a)-priceOf(b)||sameColor(a)-sameColor(b)||byDeal(a,b)
    :!state.sort?fallback:(a,b)=>compareBy(state.sort,COLUMNS[state.sort].dir)(a,b)||byDeal(a,b);
  const source=picked?[...new Set(list.map(o=>o.group))].flatMap(g=>filtered(byGroup.get(g)||[],true).filter(o=>o.availability==="AVAILABLE"&&keep(o))):list;
  const rows=new Map();
  for(const o of source.slice().sort(best)){
    if(rows.has(o.group)) rows.get(o.group).others+=1; else rows.set(o.group,{offer:o,others:0});
  }
  for(const r of rows.values()) r.offer.other_offers=r.others;
  return [...rows.values()].map(r=>r.offer).sort(sorter(fallback));
}

  document.querySelectorAll(".mine").forEach(b=>b.setAttribute("aria-pressed",String(mineOn())));
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===state.tab));
  const box=document.getElementById("content"); box.replaceChildren();
  let nodes;
  if(state.notice) box.append(noticeBar());
  if(state.tab==="notrunning") nodes=notRunningView();
  else if(state.tab==="models") nodes=modelsView();
  else if(state.tab==="compare") nodes=compareView();
  else if(state.tab==="stores") nodes=storesView();
  else if(state.tab==="alerts") nodes=simpleList(DATA.alerts,a=>el("tr",{},el("td",{class:"small",text:when(a.created_at)}),el("td",{text:a.message})),"Nema alarma. Pravila se podešavaju u config.yaml (watchlist).","Alarmi se računaju posle skena. Aplikacija ne prati sajtove neprekidno.");
  else if(state.tab==="review") nodes=simpleList(DATA.review,r=>el("tr",{},el("td",{text:r.retailer}),el("td",{},safeUrl(r.url)?el("a",{href:safeUrl(r.url),target:"_blank",rel:"noopener",text:r.title}):r.title),el("td",{class:"small",text:r.reason})),"Nema dvosmislenih uparivanja.","Oglasi koji nisu sigurno upareni sa katalogom. Ne ulaze u rang dok se ne razjasne.");
  else nodes=list("",isSearching()?"Pretraga: svi modeli na stanju sa tim imenom, i oni koji nisu u rangu i imaju nisku pouzdanost ili premalo podataka. Pouzdanost piše u svakom redu. Rasprodati modeli su u kartici Svi modeli.":NOTES[state.tab]||"",viewOffers());
  box.append(...nodes.flat().filter(Boolean));
}
function download(name,type,text){const url=URL.createObjectURL(new Blob([text],{type}));const a=el("a",{href:url,download:name});a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function exportCsv(){
  const fields=["classification","score","confidence","brand","model","gender","retailer_name","seller","personal_price","old_price","discount_pct","availability","size_status","review_score","msrp_usd","msrp_rsd","observed_at","url"];
  const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
  const row=o=>({...o,personal_price:priceOf(o),discount_pct:o.claimed_discount===null?"":Math.round(o.claimed_discount*100)});
  download("ponude.csv","text/csv;charset=utf-8","﻿"+[fields.join(","),...viewOffers().map(o=>fields.map(f=>q(row(o)[f])).join(","))].join("\n"));
}
function exportJson(){download("ponude.json","application/json",JSON.stringify(viewOffers(),null,1));}
function sizePicker(sizes){
  for(const v of [...state.sizes]) if(!sizes.includes(v)) state.sizes.delete(v);  // zapamćen broj koga više nema
  const label=()=>[...state.sizes].sort(bySize).join(", ")||"Sve";
  const shown=el("span",{text:label()});
  const update=()=>{ shown.textContent=label(); render(); };
  const boxes=sizes.map(v=>{ const b=el("input",{type:"checkbox",value:v,onchange:e=>{
    if(e.target.checked) state.sizes.add(v); else state.sizes.delete(v);
    update();
  }}); b.checked=state.sizes.has(v); return b; });
  const clear=el("button",{type:"button",text:"Očisti izbor",onclick:()=>{
    state.sizes.clear(); boxes.forEach(b=>{b.checked=false;}); update();
  }});
  const box=el("details",{class:"multi"},el("summary",{},shown),
    el("div",{class:"multi-panel"},
      el("div",{class:"multi-grid"},boxes.map((b,i)=>el("label",{},b,sizes[i]))),clear));
  document.addEventListener("click",e=>{ if(box.open&&!box.contains(e.target)) box.open=false; });
  return el("div",{class:"field"},"Veličine",box);
}
// "Moj broj": brojevi iz config.yaml (preferred_eu_sizes, u podacima profile.sizes), za pol iz profila.
const MY_SIZES=(DATA.profile.sizes||[]).map(String);
const mineOn=()=>MY_SIZES.length>0&&state.sizes.size>0&&[...state.sizes].every(v=>MY_SIZES.includes(v));
// prekidač u traci filtera: pamti se zajedno sa ostalim izborom
function chip(key,text,title){
  const b=el("button",{class:"chip",type:"button","aria-pressed":String(state[key]),title,text,onclick:()=>{ state[key]=!state[key]; b.setAttribute("aria-pressed",String(state[key])); render(); }});
  return b;
}
function buildFilters(){
  const offers=DATA.offers;
  const uniq=f=>[...new Set(offers.map(f).filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),"sr",{numeric:true}));
  const select=(label,key,options,fmt)=>el("label",{},label,el("select",{onchange:e=>{state[key]=e.target.value;render();}},
    el("option",{value:"",text:"Sve"}),options.map(v=>{const o=el("option",{value:v,text:fmt?fmt(v):v});if(state[key]===String(v))o.selected=true;return o;})));
  // Svaki pol ima svoj spisak brojeva, pa izbor pola prazni izabrane brojeve.
  const genderSizes=()=>sizePicker([...new Set(profileOffers().flatMap(liveLabels))].sort(bySize));
  let picker=genderSizes();
  const genderSelect=el("select",{onchange:e=>{
    state.gender=e.target.value; state.sizes.clear();
    resetPicker(); render();
  }},[["men","Muško"],["women","Žensko"]].map(([v,t])=>el("option",{value:v,text:t})));
  genderSelect.value=state.gender;
  const resetPicker=()=>{ const next=genderSizes(); picker.replaceWith(next); picker=next; };
  const mine=MY_SIZES.length?el("button",{class:"mine",type:"button","aria-pressed":"false",text:"Moj broj",
    title:"Samo ponude koje imaju "+MY_SIZES.join(", ")+" na stanju",onclick:()=>{
      if(mineOn()) state.sizes.clear();
      else { if(state.gender!==DATA.profile.gender){ state.gender=DATA.profile.gender; genderSelect.value=state.gender; } state.sizes=new Set(MY_SIZES); }
      resetPicker(); render();
    }}):null;
  const box=document.getElementById("filters");
  const toggle=el("button",{class:"only-phone",type:"button","aria-expanded":"false",text:"Filteri",onclick:()=>{
    toggle.setAttribute("aria-expanded",String(box.classList.toggle("open"))); fitHeader();
  }});
  const retailerNames=Object.fromEntries(DATA.retailers.map(r=>[r.retailer,r.name]));
  document.getElementById("filters").append(
    el("label",{},"Model",el("input",{type:"search",placeholder:"npr. Novablast",oninput:e=>{state.q=e.target.value;render();}})),
    ...[picker, mine, chip("min4","4+ broja","Samo ponude koje imaju bar 4 različita broja na stanju"),
        chip("hideUsed","Sakrij iskorišćene","Sklanja modele koje si označio kao iskorišćene"), toggle].filter(Boolean),
    el("div",{class:"more"},
    el("label",{},"Pol",genderSelect),
    select("Brend","brand",uniq(o=>o.brand)),
    select("Prodavnica","retailer",uniq(o=>o.retailer),v=>retailerNames[v]||v),
    select("Kategorija","category",Object.keys(CATS),v=>CATS[v]),
    el("label",{},"Min. cena",el("input",{id:"minprice",type:"number",min:0,step:500,placeholder:"npr. 12000",oninput:e=>{state.minPrice=e.target.value;render();}})),
    el("label",{},"Maks. cena",el("input",{id:"maxprice",type:"number",min:0,step:500,oninput:e=>{state.maxPrice=e.target.value;render();}})),
    el("label",{title:"Popust koji navodi prodavac; nije potvrđena ušteda"},"Min. popust %",el("input",{type:"number",min:0,max:90,step:5,oninput:e=>{state.minDiscount=e.target.value;render();}})),
    select("Min. pouzdanost","confidence",["low","medium","high"]),
    // Artifakt ne dozvoljava preuzimanje fajlova, pa tamo nema izvoza.
    ...(window.DEAL_STATIC?[]:[el("button",{onclick:exportCsv,text:"Izvezi CSV"}),
    el("button",{onclick:exportJson,text:"Izvezi JSON"})])));
  document.getElementById("tabs").append(...TABS.map(([k,t])=>el("button",{"data-tab":k,role:"tab",onclick:()=>{state.tab=k;state.notice=null;render();},text:t})));
}
const p=DATA.profile;
const meta=document.getElementById("meta"), xmeta=el("span",{class:"xmeta"});
meta.append(`Poslednji sken: ${when(DATA.generated_at)}`,xmeta);
xmeta.append(` | Modela u prodavnicama: ${DATA.counts.models_seen} | Sa ocenama u katalogu: ${DATA.counts.catalog_models} | Opažanja cena: ${DATA.counts.observations}`);
if(DATA.fx) xmeta.append(" | ",el("a",{href:"https://www.exchangerate-api.com",target:"_blank",rel:"noopener",text:"Rates By Exchange Rate API"}),`: 1 USD = ${DATA.fx.rate.toFixed(2)} RSD`+(DATA.fx.eur_rate?`, 1 EUR = ${DATA.fx.eur_rate.toFixed(2)} RSD`:""));
if((DATA.foreign_sources||[]).length) xmeta.append(" | Cene u EU: "+DATA.foreign_sources.map(s=>`${s.name} (${s.prices}, ${when(s.checked_at)})`).join(", "));
// Sken ide jednom dnevno; stariji podaci znače da jutarnji sken nije uspeo.
const STALE_HOURS=30, ageHours=(Date.now()-new Date(DATA.generated_at+"Z"))/36e5;
if(ageHours>STALE_HOURS) meta.after(el("div",{class:"stale",role:"alert",text:`Podaci su stari ${Math.max(1,Math.floor(ageHours/24))} dan(a). Jutarnji sken verovatno nije uspeo.`}));
// Na GitHub stranici: dugme direktno pokreće sken (workflow_dispatch) ključem koji je sačuvan samo na ovom uređaju.
// Ključ je fine-grained token samo za ovaj repozitorijum, sa jedinom dozvolom Actions: Read and write.
const pagesHost=location.hostname.endsWith(".github.io");
const REPO=pagesHost?`${location.hostname.split(".")[0]}/${location.pathname.split("/")[1]}`:null;
if(REPO){
  const API=`https://api.github.com/repos/${REPO}`, WF=`${API}/actions/workflows/dnevni-sken.yml`, TOKEN_KEY="gh-scan-token", GAP_HOURS=3;
  const getToken=()=>{ try{ return localStorage.getItem(TOKEN_KEY); }catch(e){ return null; } };
  const setToken=t=>{ try{ t?localStorage.setItem(TOKEN_KEY,t):localStorage.removeItem(TOKEN_KEY); }catch(e){} };
  const header=document.querySelector("header");
  const status=el("div",{class:"running",role:"status"});
  const btn=el("button",{class:"scanbtn",type:"button",title:"Pokreće sken na GitHubu. Traje oko 45 minuta, a ručni je dozvoljen jednom u 3 sata.",text:"Pokreni sken"});
  const say=(t,bad)=>{ status.textContent=t; status.style.color=bad?"var(--bad)":""; };
  const latestRun=()=>fetch(`${WF}/runs?per_page=3`,{cache:"no-store"}).then(r=>r.ok?r.json():null).then(j=>((j&&j.workflow_runs)||[]).find(r=>["in_progress","queued","waiting","requested","pending"].includes(r.status))).catch(()=>null);
  const showRunning=run=>say(`Sken je u toku od ${new Date(run.run_started_at||run.created_at).toLocaleTimeString("sr-RS",{timeStyle:"short"})}. Nove cene stižu za oko 45 minuta, pa osveži stranicu.`);
  // Forma za ključ: prikazuje se samo prvi put ili kad ključ prestane da važi.
  const tokenUrl="https://github.com/settings/personal-access-tokens/new?name=Dashboard%20patike&description=Dugme%20Pokreni%20sken&expires_in=none&actions=write";
  const form=el("div",{class:"tokenform",hidden:true});
  const input=el("input",{type:"password",placeholder:"github_pat_...",autocomplete:"off",style:"width:100%;margin:6px 0"});
  form.append(
    el("div",{},"Treba mi jednom tvoj GitHub ključ da bi dugme moglo samo da pokrene sken. Čuva se samo na ovom uređaju."),
    el("ol",{style:"margin:6px 0;padding-left:20px"},
      el("li",{},el("a",{href:tokenUrl,target:"_blank",rel:"noopener",text:"Otvori pravljenje ključa"})),
      el("li",{},`Repository access: Only select repositories → ${REPO.split("/")[1]}`),
      el("li",{},"Permissions: Actions → Read and write (već izabrano)"),
      el("li",{},"Generate token, kopiraj ga i nalepi ovde")),
    input,
    el("button",{type:"button",class:"scanbtn",text:"Sačuvaj i pokreni",onclick:()=>{ const t=input.value.trim(); if(!/^(github_pat_|ghp_)/.test(t)){ say("To ne liči na GitHub ključ (počinje sa github_pat_).",true); return; } setToken(t); input.value=""; form.hidden=true; start(); }}),
    el("button",{type:"button",class:"scanbtn",style:"margin-left:6px",text:"Otkaži",onclick:()=>{ form.hidden=true; say(""); }}));
  async function start(){
    const token=getToken();
    if(!token){ form.hidden=false; input.focus(); return; }
    btn.disabled=true; say("Proveravam...");
    try{
      const run=await latestRun();
      if(run){ showRunning(run); return; }
      // Isto pravilo kao u workflow-u: ručni sken najviše jednom u 3 sata.
      const rel=await fetch(`${API}/releases/tags/stanje`,{cache:"no-store"}).then(r=>r.ok?r.json():null).catch(()=>null);
      const asset=rel&&(rel.assets||[]).find(a=>a.name==="stanje.enc");
      if(asset){ const mins=Math.floor((Date.now()-new Date(asset.updated_at))/6e4), left=GAP_HOURS*60-mins;
        if(left>0){ say(`Poslednji sken je završen pre ${mins} min. Novi može za ${Math.floor(left/60)} h ${left%60} min.`,true); return; } }
      const r=await fetch(`${WF}/dispatches`,{method:"POST",headers:{Authorization:`Bearer ${token}`,Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"},body:JSON.stringify({ref:"main",inputs:{mode:"sken"}})});
      if(r.status===204){ say("Sken je pokrenut. Traje oko 45 minuta, pa osveži stranicu."); setTimeout(()=>latestRun().then(run=>run&&showRunning(run)),8000); return; }
      if(r.status===401||r.status===403||r.status===404){ setToken(null); say("Ključ ne važi ili nema dozvolu Actions: Read and write. Unesi novi.",true); form.hidden=false; return; }
      say(`GitHub je odbio pokretanje (greška ${r.status}). Probaj ponovo za par minuta.`,true);
    }catch(e){ say("Nema veze sa GitHubom. Proveri internet i probaj ponovo.",true); }
    finally{ btn.disabled=false; }
  }
  btn.addEventListener("click",start);
  // Link sa #sken (dugme iz Claude artifakta) odmah pokreće sken; oznaka se briše da osvežavanje ne pokrene novi.
  if(location.hash==="#sken"){ history.replaceState(null,"",location.pathname+location.search); setTimeout(start,0); }
  header.append(btn,status,form);
  latestRun().then(run=>run&&showRunning(run));
}
buildFilters(); render();
// Izveštaj nosi oznake iz trenutka pravljenja; server ima najnovije. Otvoren kao fajl, dashboard koristi one iz izveštaja.
fetch("api/not-running").then(r=>r.ok?r.json():null).then(marks=>{ if(marks){ syncNotRunning(marks); render(); } }).catch(()=>{});
// Zaglavlje kolona ostaje odmah ispod filtera i kada se filteri prelome u više redova.
function fitHeader(){ document.documentElement.style.setProperty("--filters-h",document.getElementById("filters").offsetHeight+"px"); }
fitHeader(); addEventListener("resize",fitHeader);
</script>
